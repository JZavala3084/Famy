spring:
  application:
    name: famy-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/famy}
    username: ${SPRING_DATASOURCE_USERNAME:famy}
    password: ${DB_PASSWORD:famy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: never
  shutdown: graceful

management:
  health:
    # Una caída del SMTP no debe marcar la API como caída (los correos fallidos quedan en el log).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

famy:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    secure-cookie: ${JWT_SECURE_COOKIE:true}
  google:
    client-ids: ${GOOGLE_CLIENT_ID_WEB:},${GOOGLE_CLIENT_ID_ANDROID:},${GOOGLE_CLIENT_ID_IOS:}
  mail:
    from: ${MAIL_FROM:Famy <no-reply@famy.local>}
    mode: ${MAIL_MODE:log}

logging:
  level:
    org.hibernate.orm.deprecation: error
