<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Famy · Crear cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B5E}a:hover{color:#15524A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1D22; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 20px">
  <a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E2DC; display: flex; align-items: center; justify-content: center; color: #1B1D22">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Crea tu cuenta</h1>
    <p style="margin: 0; font-size: 15px; color: #5E6470">Después podrás crear tu familia o unirte a una.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nombre" style="font-size: 14px; font-weight: 600">Nombre</label>
      <input id="nombre" type="text" placeholder="Tu nombre" style="height: 48px; box-sizing: border-box; border: 1px solid #D9D6CF; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1B1D22">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="correo" style="font-size: 14px; font-weight: 600">Correo electrónico</label>
      <input id="correo" type="email" placeholder="tu@correo.com" style="height: 48px; box-sizing: border-box; border: 1px solid #D9D6CF; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1B1D22">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="clave" style="font-size: 14px; font-weight: 600">Contraseña</label>
      <input id="clave" type="password" value="Famy2026!" style="height: 48px; box-sizing: border-box; border: 1px solid #1E6B5E; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1B1D22">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 4px">
        <div style="height: 6px; border-radius: 3px; background: #1E6B5E"></div>
        <div style="height: 6px; border-radius: 3px; background: #1E6B5E"></div>
        <div style="height: 6px; border-radius: 3px; background: #1E6B5E"></div>
        <div style="height: 6px; border-radius: 3px; background: #E4E2DC"></div>
      </div>
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #1E6B5E">Seguridad: buena</p>
      <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{r.color}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
            {{r.text}}
          </div>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; color: #5E6470">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #1E6B5E; flex: none">
      Acepto los términos y el aviso de privacidad de Famy.
    </label>
  </form>

  <div style="flex: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Familia.dc.html" style="height: 52px; border-radius: 14px; background: #1E6B5E; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Crear cuenta</a>
    <a href="Familia.dc.html" style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D9D6CF; color: #1B1D22; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid #1B1D22; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">G</span>
      Registrarme con Google
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'M5 12l5 5 9-10';
    const no = 'M12 8v5 M12 16.5v.01';
    return {
      rules: [
        { text: 'Mínimo 8 caracteres', icon: ok, color: '#1E6B5E' },
        { text: 'Una mayúscula y una minúscula', icon: ok, color: '#1E6B5E' },
        { text: 'Al menos un número', icon: ok, color: '#1E6B5E' },
        { text: 'Recomendado: 12 caracteres o más', icon: no, color: '#5E6470' }
      ]
    };
  }
}
</script>
</body>
</html>
