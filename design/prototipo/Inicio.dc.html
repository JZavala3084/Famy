          <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">{{c.value}}</span>
          <span style="font-size: 12px; color: #5E6470">{{c.sub}}</span>
        </a>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Hoy · martes 10</h2>
        <a href="Horarios.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">Ver agenda</a>
      </div>
      <sc-for list="{{today}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 46px; font-size: 13px; font-weight: 700; color: #5E6470">{{e.time}}</span>
          <span style="width: 4px; height: 30px; border-radius: 2px; background: {{e.color}}"></span>
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 600">{{e.title}}</span>
            <span style="font-size: 12px; color: #5E6470">{{e.who}}</span>
          </div>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Accesos</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{modules}}" as="m" hint-placeholder-count="8">
          <a href="{{m.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #1B1D22; font-size: 12px; font-weight: 600">
            <span style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E2DC; display: flex; align-items: center; justify-content: center; color: {{m.color}}">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
            </span>
            {{m.label}}
          </a>
        </sc-for>
      </div>
    </section>
  </main>
  <dc-import name="TabBar" active="inicio" hint-size="390px,84px"></dc-import>
</div>
