<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Famy · Horarios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B5E}a:hover{color:#15524A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1D22; display: flex; flex-direction: column">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-size: 14px; color: #5E6470">Noviembre 2026</p>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Horarios</h1>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #1E6B5E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
        Evento
      </button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" onClick="{{d.pick}}" style="height: 64px; border: 1px solid {{d.border}}; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0">
          <span style="font-size: 12px; font-weight: 600">{{d.w}}</span>
          <span style="font-size: 18px; font-weight: 800">{{d.n}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E2DC; font-size: 13px; font-weight: 600">
          <span style="width: 20px; height: 20px; border-radius: 10px; background: {{p.color}}"></span>{{p.name}}
        </span>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{dayTitle}}</h2>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
        <div style="display: flex; gap: 12px; align-items: stretch">
          <span style="width: 48px; padding-top: 12px; font-size: 13px; font-weight: 700; color: #5E6470">{{e.time}}</span>
          <div style="flex: 1; background: {{e.bg}}; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{e.title}}</span>
            <span style="font-size: 12px; color: #4A4F59">{{e.meta}}</span>
          </div>
        </div>
      </sc-for>
    </section>
  </main>
  <dc-import name="TabBar" active="agenda" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 1 }; }
  renderVals() {
    const ws = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    const names = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
    const sel = this.state.day;
    const days = ws.map((w, i) => {
      const on = i === sel;
      return { w, n: 9 + i, bg: on ? '#1E6B5E' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B1D22', border: on ? '#1E6B5E' : '#E4E2DC', pick: () => this.setState({ day: i }) };
    });
    const T = '#E3F0EC', C = '#FBE9E0', B = '#E6ECF7', P = '#EEE8F6';
    const weekday = [
      { time: '07:30', title: 'Llevar a la escuela', meta: 'Sofía y Diego · Papá', bg: P },
      { time: '09:00', title: 'Trabajo', meta: 'Mamá · hasta 17:00', bg: C },
      { time: '16:00', title: 'Fútbol', meta: 'Diego · cancha municipal', bg: B },
      { time: '17:30', title: 'Clase de piano', meta: 'Sofía · Mamá recoge', bg: P },
      { time: '19:00', title: 'Cena familiar', meta: 'Todos · tacos de pollo', bg: T }
    ];
    const weekend = [
      { time: '10:00', title: 'Limpieza general', meta: 'Todos · ver Tareas', bg: T },
      { time: '13:00', title: 'Comida con abuelos', meta: 'Todos', bg: C }
    ];
    return {
      days,
      dayTitle: names[sel].charAt(0).toUpperCase() + names[sel].slice(1) + ' ' + (9 + sel),
      events: sel >= 5 ? weekend : weekday,
      people: [
        { name: 'Todos', color: '#1E6B5E' }, { name: 'Papá', color: '#2F5DA8' }, { name: 'Mamá', color: '#C2562E' },
        { name: 'Sofía', color: '#6B4FA0' }, { name: 'Diego', color: '#8A6A12' }
      ]
    };
  }
}
</script>
</body>
</html>
