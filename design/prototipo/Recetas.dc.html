<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Famy · Recetas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B5E}a:hover{color:#15524A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1D22; display: flex; flex-direction: column">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; gap: 12px">
      <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E2DC; display: flex; align-items: center; justify-content: center; color: #1B1D22; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; flex: 1">Recetas</h1>
      <button type="button" aria-label="Nueva receta" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1E6B5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
      </button>
    </header>

    <div style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; border: 1px solid #D9D6CF; border-radius: 12px; padding: 0 14px; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4-4"></path></svg>
      <label for="buscar" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar receta</label>
      <input id="buscar" type="search" placeholder="Buscar receta o ingrediente" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent; color: #1B1D22">
    </div>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <span style="padding: 8px 14px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}; font-size: 13px; font-weight: 600">{{c.label}}</span>
      </sc-for>
    </div>

    <article style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 20px; overflow: hidden">
      <div style="height: 128px; background: #FBE9E0; display: flex; align-items: center; justify-content: center; color: #9E4220; font-size: 13px; font-weight: 600; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z M4 15l4-4 4 4 3-3 5 5"></path></svg>
        [Foto de la receta]
      </div>
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 12px; font-weight: 700; color: #9E4220; text-transform: uppercase; letter-spacing: 0.06em">Cena de hoy</p>
        <h2 style="margin: 0; font-size: 19px; font-weight: 800">Tacos de pollo</h2>
        <p style="margin: 0; font-size: 13px; color: #5E6470">30 min · 4 porciones · 8 ingredientes</p>
        <a href="Compras.dc.html" style="margin-top: 4px; height: 44px; border-radius: 12px; background: #E3F0EC; color: #1E6B5E; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"></path></svg>
          Añadir 3 ingredientes faltantes a Compras
        </a>
      </div>
    </article>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="2">
        <article style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; overflow: hidden">
          <div style="height: 72px; background: {{r.bg}}"></div>
          <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
            <h3 style="margin: 0; font-size: 14px; font-weight: 700">{{r.name}}</h3>
            <p style="margin: 0; font-size: 12px; color: #5E6470">{{r.meta}}</p>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
  <dc-import name="TabBar" active="inicio" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { bg: '#1B1D22', fg: '#FFFFFF', border: '#1B1D22' };
    const off = { bg: '#FFFFFF', fg: '#1B1D22', border: '#E4E2DC' };
    return {
      chips: [{ label: 'Todas', ...on }, { label: 'Favoritas', ...off }, { label: 'Rápidas', ...off }, { label: 'Menú semanal', ...off }],
      recipes: [
        { name: 'Sopa de verduras', meta: '40 min · 6 porciones', bg: '#E3F0EC' },
        { name: 'Pancakes de avena', meta: '15 min · 4 porciones', bg: '#E6ECF7' }
      ]
    };
  }
}
</script>
</body>
</html>
