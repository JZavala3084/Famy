<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Famy · Cumpleaños</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B5E}a:hover{color:#15524A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1D22; display: flex; flex-direction: column">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; gap: 12px">
      <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E2DC; display: flex; align-items: center; justify-content: center; color: #1B1D22; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; flex: 1">Cumpleaños</h1>
      <button type="button" aria-label="Agregar cumpleaños" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1E6B5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
      </button>
    </header>

    <section style="background: #6B4FA0; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 56px; height: 56px; border-radius: 28px; background: #FFFFFF; color: #6B4FA0; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">S</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 600; color: #E3DAF2">Próximo cumpleaños</span>
          <span style="font-size: 22px; font-weight: 800">Sofía cumple 9</span>
          <span style="font-size: 13px; color: #E3DAF2">Domingo 22 de noviembre</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <span style="background: #7E64B0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center"><b style="font-size: 20px">12</b><span style="font-size: 11px; color: #E3DAF2">días</span></span>
        <span style="background: #7E64B0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center"><b style="font-size: 20px">3</b><span style="font-size: 11px; color: #E3DAF2">ideas de regalo</span></span>
        <span style="background: #7E64B0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center"><b style="font-size: 20px">$1,500</b><span style="font-size: 11px; color: #E3DAF2">presupuesto</span></span>
      </div>
      <a href="#" style="height: 44px; border-radius: 12px; background: #FFFFFF; color: #4E3680; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Ver lista de regalos</a>
    </section>

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 14px; padding: 10px 14px; font-size: 13px; color: #5E6470">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 21h4"></path></svg>
      Recordatorio a toda la familia 7 días y 1 día antes
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Este año</h2>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 14px; padding: 10px 12px">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{p.color}}; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.i}}</span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 12px; color: #5E6470">{{p.meta}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 700; color: #5E6470">{{p.date}}</span>
        </div>
      </sc-for>
    </section>
  </main>
  <dc-import name="TabBar" active="inicio" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      people: [
        { i: 'A', name: 'Abuela Rosa', meta: 'Cumple 70 · familia extendida', date: '14 dic', color: '#8A6A12' },
        { i: 'D', name: 'Diego', meta: 'Cumple 12', date: '3 feb', color: '#2F5DA8' },
        { i: 'A', name: 'Ana', meta: 'Mamá', date: '19 abr', color: '#C2562E' },
        { i: 'J', name: 'Jose', meta: 'Papá', date: '8 jul', color: '#1E6B5E' }
      ]
    };
  }
}
</script>
</body>
</html>
