name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Las pruebas de integración usan Testcontainers (Docker ya viene en ubuntu-latest).
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: backend/build/reports/tests/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: famy-api:ci

  scan:
    name: Escaneo de dependencias
    runs-on: ubuntu-latest
    # Informativo por ahora: reporta vulnerabilidades sin bloquear el PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
